
input {
  file {
    path => "/usr/share/logstash/logs/auth.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"
    codec => json
  }
}

filter {
  if ![event_type] {
    mutate {
      add_field => {
        "event_type" => "unclassified"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-auth-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
